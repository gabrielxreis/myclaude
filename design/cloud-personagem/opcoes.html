<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud: 5 opções</title>
<style>
  :root { --bg:#0A0B0D; --card:#14151A; --line:#26282F; --text:#EDEFF3; --muted:#8E939C; --accent:#7CC4FF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  button { background:#22252C; color:var(--text); border:1px solid #33363E; border-radius:999px; padding:7px 13px; font:inherit; font-size:13px; cursor:pointer; }
  button.on { background:var(--accent); color:#06121F; border-color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; }
  canvas { width:100%; height:auto; display:block; border-radius:12px; cursor:pointer;
           background:radial-gradient(110% 90% at 50% 30%, #1C2030 0%, #0C0E13 72%); }
  .card h3 { margin:10px 4px 2px; font-size:15px; }
  .card p { margin:0 4px 4px; color:var(--muted); font-size:12px; }
  .notch { display:flex; align-items:center; gap:10px; margin-top:8px; background:#000; border-radius:0 0 16px 16px; padding:6px 10px; }
  .notch canvas { width:56px; height:56px; background:none; cursor:default; }
  .notch span { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<main>
  <h1>Cloud: 5 opções de design</h1>
  <p class="sub">Toque num bichinho para ele pular feliz. Passe o mouse para ele te olhar. Use os botões para comparar todos no mesmo humor.</p>
  <div class="bar" id="moods"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const OPTIONS = [
  { id: 1, name: "1. Marshmallow com topete", desc: "Corpo liso e redondinho como o atual, com um tufinho de nuvem no topo." },
  { id: 2, name: "2. Nuvem gordinha", desc: "Nuvem bem redonda, só duas bolinhas em cima, base macia." },
  { id: 3, name: "3. Bolinha com orelhas de nuvem", desc: "Corpo redondo e duas orelhinhas fofas de nuvem." },
  { id: 4, name: "4. Vapor flutuante", desc: "Topo em cúpula e base ondulada, como um fantasminha de vapor." },
  { id: 5, name: "5. Chibi com bracinhos", desc: "Formato pílula, cabelo de nuvem e bracinhos que acenam." },
];
const MOODS = [["parado", "Parado"], ["ouvindo", "Ouvindo"], ["feliz", "Feliz"], ["pensando", "Pensando"], ["sono", "Com sono"]];
let mood = "parado", moodStart = performance.now();

const moodsEl = document.getElementById("moods");
MOODS.forEach(([k, l]) => {
  const b = document.createElement("button"); b.textContent = l; b.dataset.k = k;
  if (k === mood) b.classList.add("on");
  b.onclick = () => { mood = k; moodStart = performance.now(); [...moodsEl.children].forEach(c => c.classList.toggle("on", c.dataset.k === k)); };
  moodsEl.appendChild(b);
});

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

// ---------- Bodies (all centred on 0,0, about 1 unit wide; s = pixels per unit) ----------

function bodyPath(ctx, id, s, T) {
  ctx.beginPath();
  switch (id) {
    case 1: { // marshmallow: superellipse-ish squircle
      const w = 0.5 * s, h = 0.42 * s, r = 0.3 * s;
      roundRect(ctx, -w, -h, 2 * w, 2 * h, r);
      break;
    }
    case 2: { // chubby cloud, two top bumps
      ctx.moveTo(-0.44 * s, 0.32 * s);
      ctx.bezierCurveTo(-0.62 * s, 0.30 * s, -0.62 * s, 0.0, -0.40 * s, -0.04 * s);
      ctx.bezierCurveTo(-0.40 * s, -0.40 * s, 0.02 * s, -0.46 * s, 0.08 * s, -0.20 * s);
      ctx.bezierCurveTo(0.20 * s, -0.40 * s, 0.56 * s, -0.30 * s, 0.46 * s, -0.02 * s);
      ctx.bezierCurveTo(0.66 * s, 0.02 * s, 0.64 * s, 0.32 * s, 0.44 * s, 0.34 * s);
      ctx.bezierCurveTo(0.30 * s, 0.46 * s, -0.30 * s, 0.46 * s, -0.44 * s, 0.32 * s);
      break;
    }
    case 3: { // round ball
      ctx.ellipse(0, 0.02 * s, 0.46 * s, 0.42 * s, 0, 0, Math.PI * 2);
      break;
    }
    case 4: { // dome with wavy steam bottom
      const w = 0.42 * s, wave = Math.sin(T * 2.4);
      ctx.moveTo(-w, 0.0);
      ctx.bezierCurveTo(-w, -0.56 * s, w, -0.56 * s, w, 0.0);
      ctx.lineTo(w, 0.28 * s);
      const n = 4;
      for (let i = 0; i < n; i++) {
        const x0 = w - (i / n) * 2 * w, x1 = w - ((i + 1) / n) * 2 * w;
        const dip = (i % 2 ? 0.06 : -0.02) + wave * 0.02 * (i % 2 ? 1 : -1);
        ctx.quadraticCurveTo((x0 + x1) / 2, (0.40 + dip) * s, x1, 0.28 * s);
      }
      ctx.closePath();
      break;
    }
    case 5: { // pill
      roundRect(ctx, -0.36 * s, -0.40 * s, 0.72 * s, 0.84 * s, 0.34 * s);
      break;
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// Soft, glossy fill: top-light gradient, inner bottom shade, rim glow, specular.
function fillBody(ctx, id, s, T, tint) {
  ctx.save();
  ctx.shadowColor = tint.glow; ctx.shadowBlur = 0.16 * s;
  bodyPath(ctx, id, s, T);
  const g = ctx.createLinearGradient(0, -0.5 * s, 0, 0.5 * s);
  g.addColorStop(0, tint.top); g.addColorStop(0.6, tint.mid); g.addColorStop(1, tint.bottom);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  ctx.save(); bodyPath(ctx, id, s, T); ctx.clip();
  const shade = ctx.createRadialGradient(0.12 * s, 0.5 * s, 0.05 * s, 0.12 * s, 0.5 * s, 0.6 * s);
  shade.addColorStop(0, tint.shade); shade.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = shade; ctx.fillRect(-s, -s, 2 * s, 2 * s);
  const spec = ctx.createRadialGradient(-0.2 * s, -0.28 * s, 0, -0.2 * s, -0.28 * s, 0.34 * s);
  spec.addColorStop(0, "rgba(255,255,255,0.95)"); spec.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = spec; ctx.fillRect(-s, -s, 2 * s, 2 * s);
  ctx.restore();
}

const TINTS = {
  1: { top: "#FFFFFF", mid: "#F6F7FB", bottom: "#DDE3EE", shade: "rgba(150,165,200,0.30)", glow: "rgba(170,200,255,0.35)" },
  2: { top: "#FFFFFF", mid: "#F2F7FF", bottom: "#D3E2F7", shade: "rgba(120,160,215,0.32)", glow: "rgba(124,196,255,0.45)" },
  3: { top: "#FFFFFF", mid: "#F7F6FC", bottom: "#E2DDF0", shade: "rgba(165,150,205,0.30)", glow: "rgba(190,170,255,0.35)" },
  4: { top: "#FFFFFF", mid: "#EEF6FF", bottom: "rgba(205,225,250,0.85)", shade: "rgba(120,170,230,0.28)", glow: "rgba(124,196,255,0.55)" },
  5: { top: "#FFFFFF", mid: "#F7F8FB", bottom: "#E0E5EE", shade: "rgba(150,165,200,0.30)", glow: "rgba(170,200,255,0.35)" },
};

// Extras drawn behind or in front of the body.
function extrasBack(ctx, id, s, T) {
  if (id === 3) { // cloud ears
    [-1, 1].forEach(d => {
      ctx.save(); ctx.translate(d * 0.30 * s, -0.36 * s); ctx.rotate(d * (0.25 + Math.sin(T * 2 + d) * 0.06));
      puff(ctx, 0, 0, 0.13 * s, TINTS[3]);
      ctx.restore();
    });
  }
  if (id === 5) { // arms
    const wave = Math.sin(T * 5) * 0.35;
    [-1, 1].forEach(d => {
      ctx.save(); ctx.translate(d * 0.36 * s, 0.08 * s); ctx.rotate(d * (0.6 + (d > 0 ? wave : 0)));
      ctx.fillStyle = "#EEF1F6"; ctx.beginPath(); ctx.ellipse(d * 0.07 * s, 0, 0.09 * s, 0.05 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }
}
function extrasFront(ctx, id, s, T) {
  if (id === 1) { // little cloud cowlick
    ctx.save(); ctx.translate(0.04 * s, -0.42 * s); ctx.rotate(Math.sin(T * 1.8) * 0.12);
    puff(ctx, -0.05 * s, 0, 0.07 * s, TINTS[1]); puff(ctx, 0.05 * s, -0.04 * s, 0.085 * s, TINTS[1]);
    ctx.restore();
  }
  if (id === 5) { // cloud hair
    ctx.save(); ctx.translate(0, -0.40 * s);
    [[-0.18, 0.02, 0.1], [-0.05, -0.06, 0.12], [0.1, -0.04, 0.11], [0.2, 0.03, 0.08]].forEach(([x, y, r]) => puff(ctx, x * s, y * s + Math.sin(T * 2 + x * 10) * 0.006 * s, r * s, TINTS[2]));
    ctx.restore();
  }
}
function puff(ctx, x, y, r, tint) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, "#FFFFFF"); g.addColorStop(1, tint.bottom);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// ---------- Face ----------

function face(ctx, s, f, layout) {
  const { ex, ey, size } = layout;
  const gx = f.gx * 0.045 * s, gy = f.gy * 0.035 * s;
  ctx.fillStyle = `rgba(255,135,165,${f.blush})`;
  [-1, 1].forEach(d => { ctx.beginPath(); ctx.ellipse(d * (ex + 0.12 * s) + gx * 0.4, ey + 0.11 * s + gy * 0.3, 0.07 * s, 0.038 * s, 0, 0, Math.PI * 2); ctx.fill(); });
  [-1, 1].forEach(d => {
    const x = d * ex + gx, y = ey + gy;
    ctx.strokeStyle = "#17191F"; ctx.lineCap = "round";
    if (f.eyes === "happy") { ctx.lineWidth = 0.032 * s; ctx.beginPath(); ctx.arc(x, y + 0.03 * s, 0.05 * s * size, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); return; }
    if (f.eyes === "closed") { ctx.lineWidth = 0.028 * s; ctx.beginPath(); ctx.arc(x, y - 0.01 * s, 0.045 * s * size, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); return; }
    const rx = 0.056 * s * size * f.wide, ry = 0.078 * s * size * f.wide * Math.max(f.open, 0.07);
    ctx.fillStyle = "#15171D"; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    if (ry > 0.02 * s) {
      ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.ellipse(x - rx * 0.3, y - ry * 0.4, rx * 0.36, ry * 0.27, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.arc(x + rx * 0.32, y + ry * 0.4, rx * 0.15, 0, Math.PI * 2); ctx.fill();
    }
  });
  const mx = gx * 0.6, my = ey + 0.12 * s + gy * 0.5;
  ctx.strokeStyle = "#17191F"; ctx.fillStyle = "#4A2230"; ctx.lineWidth = 0.02 * s; ctx.lineCap = "round";
  ctx.beginPath();
  if (f.mouth === "smile") { ctx.arc(mx, my - 0.02 * s, 0.03 * s, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke(); }
  else if (f.mouth === "big") { ctx.arc(mx, my - 0.022 * s, 0.045 * s, 0, Math.PI); ctx.fill(); }
  else if (f.mouth === "o") { ctx.ellipse(mx, my, 0.02 * s, 0.024 * s, 0, 0, Math.PI * 2); ctx.fill(); }
  else if (f.mouth === "flat") { ctx.moveTo(mx - 0.025 * s, my); ctx.lineTo(mx + 0.025 * s, my); ctx.stroke(); }
}

// Where the face sits on each body (eyes low and close = cuter).
const LAYOUT = {
  1: { ex: 0.15, ey: 0.04, size: 1.05 },
  2: { ex: 0.15, ey: 0.08, size: 1.0 },
  3: { ex: 0.15, ey: 0.06, size: 1.1 },
  4: { ex: 0.14, ey: -0.04, size: 1.05 },
  5: { ex: 0.12, ey: 0.02, size: 1.0 },
};

// ---------- One character ----------

class Pet {
  constructor(opt, canvas, small) {
    this.opt = opt; this.c = canvas; this.ctx = canvas.getContext("2d");
    this.small = small; this.sctx = small.getContext("2d");
    this.mouse = null; this.hopAt = -1e9; this.blinkAt = performance.now() + 1000 + Math.random() * 2000; this.blinkUntil = 0;
    canvas.addEventListener("mousemove", e => { const r = canvas.getBoundingClientRect(); this.mouse = { x: ((e.clientX - r.left) / r.width - 0.5) * 2.2, y: ((e.clientY - r.top) / r.height - 0.45) * 2.2 }; });
    canvas.addEventListener("mouseleave", () => this.mouse = null);
    canvas.addEventListener("click", () => this.hopAt = performance.now());
  }
  render(ctx, W, H, scale, now, compact) {
    const T = now / 1000, id = this.opt.id, s = scale;
    ctx.clearRect(0, 0, W, H);
    if (now > this.blinkAt) { this.blinkUntil = now + 120; this.blinkAt = now + 2200 + Math.random() * 2600; }
    const f = { gx: 0, gy: 0, open: now < this.blinkUntil ? 0.08 : 1, wide: 1, eyes: "open", mouth: "smile", blush: 0.55 };
    if (this.mouse && !compact) { f.gx = clamp(this.mouse.x, -1.2, 1.2); f.gy = clamp(this.mouse.y, -1, 1); }
    else { f.gx = Math.sin(T * 0.6 + id) * 0.4; f.gy = Math.sin(T * 0.45 + id) * 0.2; }
    let oy = Math.sin(T * 1.4 + id) * 0.018 * s, b = Math.sin(T * 2.1 + id) * 0.018, tilt = 0;
    if (id === 4) oy += Math.sin(T * 1.1) * 0.03 * s;
    const mt = (now - moodStart) / 1000;
    switch (mood) {
      case "ouvindo": oy += (mt < 0.45 ? -Math.sin(easeOut(mt / 0.45) * Math.PI) * 0.14 : 0) * s; f.wide = 1.15; f.gx = 0; f.gy = 0; f.mouth = "o"; break;
      case "feliz": oy -= Math.abs(Math.sin(T * 6)) * 0.06 * s; f.eyes = "happy"; f.mouth = "big"; f.blush = 0.85; break;
      case "pensando": f.gx = 0.8; f.gy = -0.8; f.mouth = "flat"; tilt = Math.sin(T * 1.2) * 0.04; break;
      case "sono": f.eyes = "closed"; f.mouth = "o"; b = Math.sin(T * 1.1) * 0.025; break;
    }
    const ht = (now - this.hopAt) / 1000;
    if (ht < 0.6) { oy -= Math.sin(easeOut(ht / 0.6) * Math.PI) * 0.16 * s; f.eyes = "happy"; f.mouth = "big"; f.blush = 0.85; }

    const cx = W / 2, cy = H * 0.56 + oy;
    // ground shadow
    ctx.save(); ctx.translate(W / 2, H * 0.56 + 0.5 * s); ctx.scale(1, 0.18);
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.arc(0, 0, 0.36 * s * (1 + oy / (3 * s)), 0, Math.PI * 2); ctx.fill(); ctx.restore();

    ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt); ctx.scale(1 + b, 1 - b);
    extrasBack(ctx, id, s, T);
    fillBody(ctx, id, s, T, TINTS[id]);
    extrasFront(ctx, id, s, T);
    const L = LAYOUT[id];
    face(ctx, s, f, { ex: L.ex * s, ey: L.ey * s, size: L.size });
    ctx.restore();

    if (mood === "sono") {
      ctx.save(); ctx.fillStyle = "rgba(200,220,255,0.9)";
      for (let i = 0; i < 3; i++) { const p = (T * 0.5 + i / 3) % 1; ctx.globalAlpha = 1 - p;
        ctx.font = `600 ${(0.06 + p * 0.06) * s}px -apple-system, sans-serif`; ctx.fillText("z", cx + (0.32 + p * 0.18) * s, cy - (0.38 + p * 0.3) * s); }
      ctx.restore();
    }
    if (mood === "pensando") {
      for (let i = 0; i < 3; i++) { const a = 0.35 + 0.65 * Math.max(0, Math.sin(T * 4 - i * 0.7));
        ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(cx + (0.34 + i * 0.09) * s, cy - (0.5 + i * 0.06) * s, (0.022 + i * 0.007) * s, 0, Math.PI * 2); ctx.fill(); }
    }
    if (mood === "ouvindo") {
      for (let i = 0; i < 3; i++) { const p = (T * 1.4 + i / 3) % 1;
        ctx.strokeStyle = `rgba(124,196,255,${0.7 * (1 - p)})`; ctx.lineWidth = 0.016 * s;
        [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(cx + d * 0.56 * s, cy, (0.07 + p * 0.16) * s, d < 0 ? Math.PI * 0.7 : -Math.PI * 0.3, d < 0 ? Math.PI * 1.3 : Math.PI * 0.3); ctx.stroke(); }); }
    }
  }
}

const grid = document.getElementById("grid"), pets = [];
OPTIONS.forEach(o => {
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<canvas width="560" height="420" aria-label="${o.name}"></canvas><h3>${o.name}</h3><p>${o.desc}</p>
    <div class="notch"><canvas width="112" height="112"></canvas><span>no tamanho do notch</span></div>`;
  grid.appendChild(card);
  const [bigC, smallC] = card.querySelectorAll("canvas");
  pets.push(new Pet(o, bigC, smallC));
});

function loop(now) {
  pets.forEach(p => { p.render(p.ctx, p.c.width, p.c.height, 330, now, false); p.render(p.sctx, p.small.width, p.small.height, 74, now, true); });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
